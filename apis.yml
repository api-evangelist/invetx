name: Invetx *
description: >-
  Invetx was a Boston-based veterinary biotechnology company developing protein-based
  therapeutics — species-specific, half-life-extended monoclonal antibodies (mAbs) — for
  chronic conditions in companion animals (dogs and cats). Its integrated platform spanned
  antibody discovery, optimization, Fc-variant half-life extension, development and
  manufacturing, with lead program IVX-01. Backed by GV, F-Prime Capital, Novo Holdings,
  Eight Roads, Anterra Capital, Casdin Capital and Tekla, Invetx was acquired by Dechra
  Pharmaceuticals in July 2024 for up to $520M. It exposes no public API, developer, or
  documentation surface, and its standalone website (invetx.com) has been decommissioned
  since the acquisition; this profile is retained as a network lead / portfolio record.
